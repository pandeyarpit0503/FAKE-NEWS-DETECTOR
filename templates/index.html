{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="text-center mb-5 animate-on-load">
            <h1 class="display-4 fw-bold mb-3">AI Fake News Detection</h1>
            <p class="lead text-muted">Advanced NLP analysis to verify article credibility</p>
        </div>

        <div class="card shadow-lg border-0 animate-on-load delay-1">
            <div class="card-header text-white" style="background: linear-gradient(135deg, #1d4ed8, #3b82f6);">
                <h5 class="mb-0"><i class="fas fa-search me-2"></i>Enter Content to Analyze</h5>
            </div>
            <div class="card-body p-4">
                <form id="analysisForm">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Article URL (Optional)</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-link"></i></span>
                            <input type="url" class="form-control" id="urlInput" 
                                   placeholder="https://example.com/news/article">
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold">OR Headline / Article Text</label>
                        <textarea class="form-control" id="textInput" rows="6" 
                                  placeholder="Paste news headline or article content here..."></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary btn-lg w-100" id="analyzeBtn">
                        <i class="fas fa-search me-2"></i>Check Credibility
                        <span class="spinner-border spinner-border-sm d-none ms-2" id="loading"></span>
                    </button>
                </form>
            </div>
        </div>

        <!-- Results Section -->
        <div id="results" class="mt-4 d-none">
            <div class="card border-0 shadow animate-fade-in-up">
                <div class="card-body p-4">
                    <div class="row align-items-center">
                        <div class="col-md-4 text-center border-end">
                            <div id="scoreCircle" class="score-circle mb-3 animate-scale-in">
                                <span id="scoreValue" class="display-3 fw-bold">0</span>
                                <small class="d-block text-muted">Trust Score</small>
                            </div>
                            <span id="predictionBadge" class="badge rounded-pill fs-6">Unknown</span>
                        </div>
                        <div class="col-md-8">
                            <h4 class="mb-3">Analysis Results</h4>
                            <p id="explanation" class="text-muted"></p>
                            
                            <div id="indicators" class="mt-3">
                                <!-- Indicators injected here -->
                            </div>

                            <!-- Verified Sources from trusted news sites -->
                            <div id="verifiedSourcesSection" class="mt-4 d-none">
                                <h5 class="mb-3"><i class="fas fa-newspaper me-2"></i>Verified by Trusted Sources</h5>
                                <div id="verifiedSourcesList" class="verified-sources-list">
                                    <!-- Populated by JS -->
                                </div>
                            </div>
                            
                            <hr>
                            <div class="row text-center">
                                <div class="col-4">
                                    <small class="text-muted d-block">Confidence</small>
                                    <strong id="confidenceVal">0%</strong>
                                </div>
                                <div class="col-4">
                                    <small class="text-muted d-block">Processing</small>
                                    <strong id="processingTime">0s</strong>
                                </div>
                                <div class="col-4">
                                    <small class="text-muted d-block">Similarity</small>
                                    <strong id="similarityCheck">Checked</strong>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
